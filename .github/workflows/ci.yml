name: Rust and X11
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb xauth xclip xdotool i3-wm xfwm4 xterm dbus-x11 x11-utils fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p feritto --features wgpu
      - name: X11 protocol and desktop integration
        run: scripts/check-x11.sh
